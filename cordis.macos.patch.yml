# macOS desktop bundle patch. Host files are only changed by an explicit Apply.

- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.

- id: dsh-purge
  inject: [systemPrompt, tools]

- insert:
    - id: dsh-purge
      name: 'dsh-purge'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
